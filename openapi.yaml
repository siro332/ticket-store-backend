openapi: 3.0.0
info:
  title: Ticket Store Backend API
  description: Comprehensive API documentation for the Ticket Store microservices.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: API Gateway
  - url: http://localhost:8081
    description: Auth Service
  - url: http://localhost:8082
    description: Event Service
  - url: http://localhost:8083
    description: Order Service
  - url: http://localhost:8084
    description: Payment Service

paths:
  # --- Auth Service ---
  /api/auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                type: string
                example: "Registration successful for user: user@example.com"
        '400':
          description: Invalid input
  
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user and get tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'
        '401':
          description: Unauthorized

  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      parameters:
        - in: query
          name: refreshToken
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'
        '401':
          description: Unauthorized
        '400':
          description: Invalid refresh token

  # --- Organization Service ---
  /api/organizations:
    get:
      tags:
        - Organization
      summary: Get all organizations (Admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '403':
          description: Forbidden - Only ADMINs can access

    post:
      tags:
        - Organization
      summary: Create a new organization (Authenticated users)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: ownerUserId
          schema:
            type: string
            format: uuid
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      responses:
        '200':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized

  /api/organizations/{id}:
    get:
      tags:
        - Organization
      summary: Get organization by ID (Admin or organization member)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Forbidden - Not an ADMIN or member
        '404':
          description: Organization not found

    put:
      tags:
        - Organization
      summary: Update organization (Admin or owner)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Forbidden - Not an ADMIN or owner
        '404':
          description: Organization not found

    delete:
      tags:
        - Organization
      summary: Delete organization (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Organization deleted
        '403':
          description: Forbidden - Only ADMINs can delete
        '404':
          description: Organization not found

  /api/organizations/{organizationId}/users/{userId}/roles/{roleId}:
    post:
      tags:
        - Organization
      summary: Add user to an organization with a specific role (Admin or organization owner)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: roleId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User added to organization with role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOrganizationRole'
        '403':
          description: Forbidden - Not an ADMIN or owner
        '404':
          description: Organization, User, or Role not found

  /api/organizations/user-organization-roles/{userOrgRoleId}/roles/{newRoleId}:
    put:
      tags:
        - Organization
      summary: Update a user's role within an organization (Admin or organization owner of the role)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userOrgRoleId
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: newRoleId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User's organization role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOrganizationRole'
        '403':
          description: Forbidden - Not an ADMIN or owner of the associated organization
        '404':
          description: UserOrganizationRole or new Role not found

  /api/organizations/user-organization-roles/{userOrgRoleId}:
    delete:
      tags:
        - Organization
      summary: Remove a user's role from an organization (Admin or organization owner of the role)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userOrgRoleId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: User's organization role removed
        '403':
          description: Forbidden - Not an ADMIN or owner of the associated organization
        '404':
          description: UserOrganizationRole not found

  /api/organizations/{organizationId}/users-roles:
    get:
      tags:
        - Organization
      summary: Get users and their roles within a specific organization (Admin or organization member)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of users and their roles in the organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserOrganizationRole'
        '403':
          description: Forbidden - Not an ADMIN or member
        '404':
          description: Organization not found

  /api/organizations/user/{userId}/organizations-roles:
    get:
      tags:
        - Organization
      summary: Get organizations and roles for a specific user (User themselves or Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of organizations and roles for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserOrganizationRole'
        '403':
          description: Forbidden - Not the user themselves or ADMIN
        '404':
          description: User not found

  # --- Order Service ---
  /api/orders:
    post:
      tags:
        - Orders
      summary: Create a new order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User ID mismatch

  /api/orders/user/{userId}:
    get:
      tags:
        - Orders
      summary: Get orders for a specific user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of orders for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User ID mismatch

  /api/orders/event/{eventId}:
    get:
      tags:
        - Orders
      summary: Get orders for a specific event (Organizer or Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/OrderStatus'
          description: Filter orders by status
      responses:
        '200':
          description: List of orders for the event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not an ORGANIZER or ADMIN

  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order details by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not ADMIN, order user, or event organizer
        '404':
          description: Order not found

    put:
      tags:
        - Orders
      summary: Update order status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/OrderStatus'
          required: true
          description: New status for the order
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid status
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Only ORGANIZERs or ADMINs can update order status
        '404':
          description: Order not found

  /api/orders/{id}/cancel:
    put:
      tags:
        - Orders
      summary: Cancel an order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Order cancelled/refunded
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not ADMIN, order user, or event organizer
        '404':
          description: Order not found

  /api/orders/{id}/payment-callback:
    post:
      tags:
        - Orders
      summary: Internal payment callback (webhook)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: transactionId
          schema:
            type: string
          required: true
        - in: query
          name: paymentStatus
          schema:
            $ref: '#/components/schemas/PaymentInfoStatus'
          required: true
      responses:
        '200':
          description: Payment info updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInfo'
        '404':
          description: Order not found

  /api/orders/{id}/tickets:
    get:
      tags:
        - Orders
      summary: Get tickets for a specific order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of tickets for the order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the order user

  /api/orders/{orderId}/initiate-payment:
    post:
      tags:
        - Orders
      summary: Initiate payment for an order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: paymentMethod
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransactionDto'
        '400':
          description: Invalid payment method or order status
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the order user

  /api/orders/{orderId}/resend-tickets:
    post:
      tags:
        - Orders
      summary: Resend tickets for an order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: recipientEmail
          schema:
            type: string
            format: email
          required: true
      responses:
        '204':
          description: Tickets resent
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the order user
        '404':
          description: Order not found

  # --- Reservation Service ---
  /api/reservations:
    post:
      tags:
        - Reservations
      summary: Create a reservation (Add to Cart)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
      responses:
        '200':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: Invalid input or purchase limit exceeded
        '401':
          description: Unauthorized

  /api/reservations/{id}:
    get:
      tags:
        - Reservations
      summary: Get reservation details by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reservation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the reservation user
        '404':
          description: Reservation not found

  /api/reservations/user/{userId}:
    get:
      tags:
        - Reservations
      summary: Get reservations for a specific user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of reservations for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the user themselves

  /api/reservations/{id}/confirm:
    post:
      tags:
        - Reservations
      summary: Confirm a pending reservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reservation confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the reservation user
        '404':
          description: Reservation not found

  /api/reservations/{id}/cancel:
    post:
      tags:
        - Reservations
      summary: Cancel a pending reservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reservation cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the reservation user
        '404':
          description: Reservation not found

  /api/reservations/cleanup-expired:
    post:
      tags:
        - Reservations
      summary: Trigger cleanup of expired reservations (Admin only)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Expired reservations cleaned up
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Only ADMINs can trigger cleanup

  /api/reservations/seat-availability/{seatId}:
    get:
      tags:
        - Reservations
      summary: Check seat availability
      parameters:
        - in: path
          name: seatId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Seat availability status
          content:
            application/json:
              schema:
                type: boolean
        '404':
          description: Seat not found

  /api/reservations/event/{eventId}/active:
    get:
      tags:
        - Reservations
      summary: Get active reservations for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of active reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationDto'
        '404':
          description: Event not found

  /api/reservations/cart:
    post:
      tags:
        - Reservations
      summary: Add or update item in user's cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
      responses:
        '200':
          description: Cart item added/updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: Invalid input or purchase limit exceeded
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User ID mismatch

  /api/reservations/cart/{reservationId}:
    delete:
      tags:
        - Reservations
      summary: Remove item from user's cart
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Cart item removed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the reservation user
        '404':
          description: Reservation not found

  /api/reservations/cart/user/{userId}:
    get:
      tags:
        - Reservations
      summary: Get cart items for a specific user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of cart items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationDto'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the user themselves

  # --- Ticket Service ---
  /api/tickets/{ticketCode}:
    get:
      tags:
        - Tickets
      summary: Get ticket details by ticket code
      responses:
        '200':
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '404':
          description: Ticket not found

  /api/tickets/user/{userId}:
    get:
      tags:
        - Tickets
      summary: Get all tickets for a specific user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of tickets for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponse'
        '404':
          description: User not found

  /api/tickets/event/{eventId}:
    get:
      tags:
        - Tickets
      summary: Get all tickets for a specific event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of tickets for the event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponse'
        '404':
          description: Event not found

  /api/tickets/{ticketCode}/scan:
    post:
      tags:
        - Tickets
      summary: Scan a ticket for check-in
      parameters:
        - in: path
          name: ticketCode
          required: true
          schema:
            type: string
        - in: query
          name: gate
          schema:
            type: string
          description: The gate at which the ticket is scanned (optional)
        - in: query
          name: deviceId
          schema:
            type: string
          description: The ID of the scanning device (optional)
      responses:
        '200':
          description: Ticket scanned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          description: Ticket already scanned or invalid
        '404':
          description: Ticket not found
        '500':
          description: Internal server error (e.g., duplicate scan, event not active)

  /api/tickets/{ticketCode}/transfer:
    post:
      tags:
        - Tickets
      summary: Transfer a ticket to a new attendee
      parameters:
        - in: path
          name: ticketCode
          required: true
          schema:
            type: string
        - in: query
          name: newAttendeeName
          schema:
            type: string
          required: true
        - in: query
          name: newAttendeeEmail
          schema:
            type: string
            format: email
          required: true
      responses:
        '200':
          description: Ticket transferred successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          description: Invalid attendee information or transfer not allowed
        '404':
          description: Ticket not found
        '500':
          description: Internal server error (e.g., transfer not enabled for event)

  /api/tickets/event/{eventId}/check-in-logs:
    get:
      tags:
        - Tickets
      summary: Get check-in logs for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of check-in logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckInLogDto'
        '404':
          description: Event not found

  # --- Reporting Service ---
  /api/reports/revenue/total:
    get:
      tags:
        - Reporting
      summary: Get total revenue across all events
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Total revenue
          content:
            application/json:
              schema:
                type: number
                format: float
          example: 12345.67
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Only ADMINs or ORGANIZERs can access reports

  /api/reports/revenue/event/{eventId}:
    get:
      tags:
        - Reporting
      summary: Get revenue for a specific event
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Revenue for the event
          content:
            application/json:
              schema:
                type: number
                format: float
          example: 5432.10
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Only ADMINs or ORGANIZERs can access reports
        '404':
          description: Event not found

  /api/reports/tickets/total-sold:
    get:
      tags:
        - Reporting
      summary: Get total number of tickets sold across all events
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Total tickets sold
          content:
            application/json:
              schema:
                type: integer
                format: int64
          example: 1500
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Only ADMINs or ORGANIZERs can access reports

  /api/reports/tickets/event/{eventId}/sold:
    get:
      tags:
        - Reporting
      summary: Get total number of tickets sold for a specific event
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Total tickets sold for the event
          content:
            application/json:
              schema:
                type: integer
                format: int64
          example: 500
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Only ADMINs or ORGANIZERs can access reports
        '404':
          description: Event not found

  # --- Payment Service ---
  /api/payments:
    post:
      tags:
        - Payments
      summary: Process a payment directly
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment transaction processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransaction'
        '400':
          description: Invalid payment request
        '401':
          description: Unauthorized

  /api/payments/refund:
    post:
      tags:
        - Payments
      summary: Process a refund
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '200':
          description: Refund transaction processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransaction'
        '400':
          description: Invalid refund request or transaction ID
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Auth
    SignupRequest:
      type: object
      properties:
        fullName:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          minLength: 6
          example: "password123"
        phone:
          type: string
          example: "123-456-7890"
      required:
        - fullName
        - email
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          example: "password123"
      required:
        - email
        - password
    JwtResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiJ9..."
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiJ9..."
        tokenType:
          type: string
          example: "Bearer"
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        fullName:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        roles:
          type: array
          items:
            type: string
          example: ["USER", "ORGANIZER"]
        permissions:
          type: array
          items:
            type: string
          example: ["event:read", "event:create"]
        organizationRoles:
          type: array
          items:
            $ref: '#/components/schemas/UserOrganizationRoleDto'

    # Event
    Event:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        organizerId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "Summer Music Festival"
        description:
          type: string
          example: "A vibrant music festival featuring various artists."
        category:
          type: string
          example: "Music"
        startTime:
          type: string
          format: date-time
          example: "2025-07-20T18:00:00Z"
        endTime:
          type: string
          format: date-time
          example: "2025-07-20T23:00:00Z"
        venue:
          $ref: '#/components/schemas/Venue'
        coverImage:
          type: string
          example: "http://example.com/image.jpg"
        status:
          $ref: '#/components/schemas/EventStatus'
        allowTicketTransfer:
          type: boolean
          example: true
        allowAttendeeNameChange:
          type: boolean
          example: true
        refundEnabled:
          type: boolean
          example: true
        refundDeadlineHours:
          type: integer
          example: 48
        refundFeePercent:
          type: number
          format: double
          example: 0.05
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Venue:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Test Arena"
        address:
          type: string
          example: "123 Main St"
        city:
          type: string
          example: "Testville"
        capacity:
          type: integer
          example: 5000
        mapImage:
          type: string
          example: "http://example.com/map.png"
    
    TicketType:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "General Admission"
        event:
          $ref: '#/components/schemas/Event'
        price:
          type: number
          format: float
          example: 50.00
        quota:
          type: integer
          example: 100
        purchaseLimit:
          type: integer
          example: 5
        startSale:
          type: string
          format: date-time
          example: "2025-06-01T00:00:00Z"
        endSale:
          type: string
          format: date-time
          example: "2025-07-19T23:59:59Z"
    
    Seat:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        section:
          type: string
          example: "A"
        rowLabel:
          type: string
          example: "10"
        seatNumber:
          type: string
          example: "05"
        seatCategory:
          type: string
          example: "VIP"
        isAvailable:
          type: boolean
          example: true
        locked:
          type: boolean
          example: false
        event:
          $ref: '#/components/schemas/Event'
        ticketType:
          $ref: '#/components/schemas/TicketType'
    
    # Order Schemas (continued)
    PaymentTransactionDto:
